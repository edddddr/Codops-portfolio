<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css"/>
    <title>Birr Watch</title>
</head>
<body>

    <header class="w-full h-80 flex items-center justify-center text-center bg-blue-300">
        <h1 class="text-8xl text-white font-extrabold">Birr Watch</h1>
    </header>

    <div class="w-full  flex items-center justify-center text-center ">

        <div>
            <h3 class="text-2xl text-blue-600 font-bold  pt-5">Convert to ETB</h3>

            <!-- <p id="status">Loading rates...</p> -->

            <div class="py-5">
                <div class="flex justify-spacebetween items-center">
                    <div>
                        <div class="flex items-center rounded-md bg-white pl-3 outline-1 -outline-offset-1 outline-gray-300 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-600">
                        <div class="shrink-0 text-base text-gray-500 select-none sm:text-sm/6">$</div>
                        <input id="price" type="text" name="price" placeholder="0.00" class="block min-w-0 grow py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6" />
                        <div class="grid shrink-0 grid-cols-1 focus-within:relative">
                            <select id="currency" name="currency" aria-label="Currency" class="col-start-1 row-start-1 w-full appearance-none rounded-md py-1.5 pr-7 pl-3 text-base text-gray-500 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                            <option>USD</option>
                            <option>CAD</option>
                            <option>EUR</option>
                            </select>
                            <svg viewBox="0 0 16 16" fill="currentColor" data-slot="icon" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                            <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
                            </svg>
                        </div>
                        </div>
                    </div>

                    <button class="bg-black hover:bg-black-100 text-white font-medium  py-1.5 px-4 rounded-lg ml-2 transition-colors " type="submit">Convert</button>
                </div>
            </form>
            
            <div>
                <p id="result">2,000</p>

            <h2>Watchlist</h2>

            <ul id="watchlist"></ul>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
    
    
</body>
</html>
